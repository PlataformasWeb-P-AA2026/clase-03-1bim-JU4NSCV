<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Demo Jquery</title>
        <script src="https://code.jquery.com/jquery-3.5.0.js"></script>
    </head>
    <body>
        <h1>Ejemplo de Uso de Jquery</h1>
        <ul id="mensajeFinal"></ul>
        <button type="submit" id="obtenerInformacion">
            Obtener información
        </button>
        <button type="submit" id="limpiarInformacion">
            Limpiar información
        </button>
    </body>
    <script>
        $(document).ready(function () {
            var url =
                "https://raw.githubusercontent.com/PlataformasWeb-P-AA2026/clase-03-1bim-JU4NSCV/refs/heads/main/ejercicio/data/data_instituciones.json";
            $("#obtenerInformacion").click(function () {
                $.ajax({
                    url: url,
                    dataType: "json",
                }).then(function (data) {
                    for (var i = 0; i < data.length; i++) {
                        console.log(data[i]);
                        $("#mensajeFinal").append(
                            "<li> <b>AMIE Institucion:</b> " +
                                data[i].AMIE +
                                " <b>Nombre Institucion:</b> " +
                                data[i]["Nombre-Educativa"] +
                                " <b>Canton Institucion:</b> " +
                                data[i].Canton +
                                " <b>Parroquia Institucion:</b> " +
                                data[i].Parroquia +
                                " <b>Provincia:</b> " +
                                data[i].Provincia +
                                "</li>",
                        );
                    }
                });
            });
            $("#limpiarInformacion").click(function () {
                $("#mensajeFinal").empty();
            });
        });
    </script>
</html>
